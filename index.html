<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GERAPPA — a fast and fun trivia game. Download on the App Store and Google Play.">
    <meta property="og:title" content="GERAPPA">
    <meta property="og:description" content="A fast and fun trivia game.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.gerappa.games/">
    <title>GERAPPA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1E88E5;
            --text-color: #212121;
            --text-secondary: #616161;
            --bg-color: #FFFFFF;
            --border-color: #E0E0E0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 48px 16px;
        }

        h1 {
            font-size: 3.5em;
            font-weight: 800;
            letter-spacing: 0.02em;
            margin-bottom: 12px;
        }

        .tagline {
            font-size: 1.15em;
            color: var(--text-secondary);
            margin-bottom: 36px;
        }

        .stores {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .store {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 190px;
            padding: 10px 20px;
            border-radius: 12px;
            background: #000000;
            color: #FFFFFF;
            text-decoration: none;
            text-align: left;
            transition: opacity 0.2s ease;
        }

        .store:hover {
            opacity: 0.85;
        }

        .store svg {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        .store small {
            display: block;
            font-size: 11px;
            opacity: 0.8;
        }

        .store strong {
            display: block;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.2;
        }

        footer {
            border-top: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            gap: 8px 24px;
            flex-wrap: wrap;
            color: var(--text-secondary);
            font-size: 0.9em;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            color: var(--primary-color);
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.6em;
            }

            .store {
                width: 100%;
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>GERAPPA</h1>
        <p class="tagline" data-i18n="tagline">A fast and fun trivia game</p>

        <div class="stores">
            <a class="store" href="https://apps.apple.com/app/gerappa/id6758739456" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
                <span><small data-i18n="appStoreSmall">Download on the</small><strong>App Store</strong></span>
            </a>
            <a class="store" href="https://play.google.com/store/apps/details?id=com.georgiangames.app" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 1.8 13.4 11.6 3.6 21.4c-.36-.2-.6-.6-.6-1.07V2.87c0-.47.24-.87.6-1.07z"/><path fill="#FBBC04" d="m16.8 8.2-3.4 3.4 3.4 3.4 3.85-2.2c.75-.43.75-1.97 0-2.4L16.8 8.2z"/><path fill="#EA4335" d="M13.4 11.6 3.6 21.4c.3.17.68.18 1.04-.02L16.8 15 13.4 11.6z"/><path fill="#4285F4" d="M3.6 1.8c.3-.17.68-.18 1.04.02L16.8 8.2l-3.4 3.4L3.6 1.8z"/></svg>
                <span><small data-i18n="playSmall">Get it on</small><strong>Google Play</strong></span>
            </a>
        </div>
    </main>

    <footer>
        <span>© 2026 GERAPPA</span>
        <span><span data-i18n="contact">Contact</span>: <a href="mailto:info@gerappa.games">info@gerappa.games</a></span>
        <a href="/privacy" data-i18n="privacy">Privacy Policy</a>
    </footer>

    <script>
        const translations = {
            en: {
                tagline: 'A fast and fun trivia game',
                appStoreSmall: 'Download on the',
                playSmall: 'Get it on',
                contact: 'Contact',
                privacy: 'Privacy Policy'
            },
            ka: {
                tagline: 'სწრაფი და სახალისო ვიქტორინა',
                appStoreSmall: 'ჩამოტვირთე',
                playSmall: 'ჩამოტვირთე',
                contact: 'კონტაქტი',
                privacy: 'კონფიდენციალურობის პოლიტიკა'
            },
            ru: {
                tagline: 'Быстрая и весёлая викторина',
                appStoreSmall: 'Загрузите в',
                playSmall: 'Доступно в',
                contact: 'Контакты',
                privacy: 'Политика конфиденциальности'
            }
        };

        // Same key as the privacy page, so a language picked there is reused here
        let lang;
        try {
            lang = localStorage.getItem('privacyPolicyLang');
        } catch (e) {}
        if (!translations[lang]) {
            lang = (navigator.language || 'en').slice(0, 2);
        }
        if (translations[lang]) {
            document.documentElement.lang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = translations[lang][el.getAttribute('data-i18n')];
            });
        }
    </script>
</body>
</html>
